[package]
name = "agentspace"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "agentspace_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"

# Windows toasts need an activation callback, which the notification plugin
# does not expose on desktop. See src/notify.rs.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
